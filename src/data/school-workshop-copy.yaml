# /education/workshop/ 冒頭リード
workshopPage:
  intro:
    - 転回社では、主に小学校〜高校向けの演劇ワークショップを行っています。
    - 過去10年にわたるワークショップ活動を元に、事例をピックアップして紹介した冊子も制作しております。お問い合わせいただければ、冊子をお送りすることも可能です。
    - 生徒・児童の状況、申請を検討している文化庁の学校向け事業などに合わせて提案が可能ですので、まずはご連絡ください。

# /publications/school-workshop/ 本文
casebookPage:
  intro:
    - 『演劇ワークショップ事例集』は、転回社が熊本県内を中心として小・中学校などで行ってきた演劇ワークショップの事例を、現場の記録と振り返りの言葉と合わせてまとめた一冊です。
    - 教育現場で演劇的アプローチをどのように活かせるのか。実施内容・時間配分・子どもたちの反応・教員との連携の仕方など、具体的な事例を通して紹介しています。
  audienceHeading: 読んでいただきたい方
  audience:
    - 学校教員／教育関係者
    - 演劇ワークショップを企画する方
    - アウトリーチ活動に関心のあるアーティスト
    - 社会教育・生涯学習関係の方
