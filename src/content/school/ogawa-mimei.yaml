  appreciationTitle: 鑑賞の手引き
  appreciationParagraphs:
    - 「日本児童文学の父」として知られる小川未明の短編童話4篇を、ひとつのミュージカルに仕立てました。
    - 叙情的な表現が多く含まれる作品のため、学年が上がるほど、より深く楽しめる作品です。朗読と音楽で、児童文学の世界に触れる入口としてご活用ください。
