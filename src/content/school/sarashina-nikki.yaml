work: "『更級日記』"
overview: エレクトロニック古典ミュージカル
sourceCredit:
  name: 菅原孝標女
synopsis: 国語の授業で習った日記文学の古典！千年前の少女の青春の日々がミュージカルで蘇る！地方在住の中流貴族・菅原孝標の娘は、憧れの源氏物語を読みたくて読みたくて、都へ帰る日を夢見ていた。東路の果てからはるばるたどり着いた都で、少女は源氏物語を読むことができるのか！
targets:
  - 中学生
  - 高校生
duration: 約100分
order: 6
page: true
