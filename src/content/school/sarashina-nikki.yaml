  script:
    - oshiyama-shiho
  direction:
    - kamei-juntaro
  cast:
    - komatsuno-nozomi
  castNote: ※ほか、転回社の俳優が出演します。
  music:
    - iwakiri-maiko
  headcount: 約10名
  spec: default
  appreciationTitle: 鑑賞の手引き
  appreciationParagraphs:
    - 平安時代の少女・菅原孝標女が記した日記文学の名作を、エレクトロニックなサウンドと語りで再構成した作品です。源氏物語への憧れや都への旅路など、教科書で触れる古典の世界が音楽劇として立ち上がります。
    - 国語科の古典読解や総合的な学習の時間とあわせた鑑賞にも向いています。中学生・高校生向けの上演時間（約100分）で、古典と現代表現の接点を楽しめる構成です。
