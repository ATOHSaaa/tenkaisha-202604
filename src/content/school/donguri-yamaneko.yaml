work: "『どんぐりと山猫』"
overview: 朗読ミュージカル
synopsis: 差出人が「山ねこ」の不思議な手紙を受け取った一郎。森を抜けて山ねこへ会いに行くと、誰が一番えらいどんぐりかを決める裁判に立ち会うことになります。めいめいに自分が一番えらいと言うどんぐりたち。一郎はいったい、どうやってこの場を鎮めるのか……？
