  spec: default
  appreciationTitle: 鑑賞の手引き
  appreciationParagraphs:
    - 『大唐大慈恩寺玄奘三蔵法師伝』を原作に、玄奘三蔵が経典を求めて西へ旅立つ姿を巡礼ミュージカルとして描きます。歴史・宗教・人物の意志が交差する物語で、教科書の世界史や公民と結びつけて鑑賞できます。
    - 上演時間は約100分。中学生・高校生向けに、音楽と語りで「西遊記」の元となった求法の旅を体感できる構成です。
