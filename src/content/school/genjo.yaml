work: "『大唐大慈恩寺玄奘三蔵法師伝』"
overview: 巡礼ミュージカル
sourceCredit:
  name: 慧立・彦悰
synopsis: あの「西遊記」の元ネタ、三蔵法師・玄奘の伝記がミュージカルに！隋から唐へと王朝が移っていく動乱の時代。仏の教えを学ぶ玄奘は、中国には経典が不完全にしか伝わっておらず、翻訳も不正確であることに気づいてしまう。仏法の真髄を理解するために——経典を求めてひたすら西へと向かい続ける玄奘の旅が始まった。兄弟の情も出世も身の安全も、全てを投げ打った狂気の天才・玄奘の冒険が始まる。
targets:
  - 中学生
  - 高校生
