work: "『細川重賢一代記』"
overview: 歴史発見ミュージカル
synopsis: 父と兄の治世によって多額の借金を背負った熊本藩六代藩主・細川重賢。財政を立て直すために小姓頭の堀平太左衛門を一番頭に抜擢し、才気をふるって数々の政策を断行する。その業績から後に「肥後の鳳凰」と称された名君・重賢が肥後熊本藩再建に奔走する一代記！
targets:
