    - 2020年　熊本市立清和小学校
  appreciationTitle: 鑑賞の手引き
  appreciationParagraphs:
    - 紀州藩第九代藩主・徳川治貞と「紀州の麒麟、肥後の鳳凰」と並び称された名君・細川重賢は、身分に関係なく実力のある者を取り立てました。歴史の勉強を本格的に始めた中学生・高校生におすすめの作品です。
