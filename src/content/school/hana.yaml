work: "『鼻』"
overview: 文学ミュージカル
sourceCredit:
  name: ニコライ・ゴーゴリ
synopsis: ペテルブルクのウォズネセンスキイ通りで暮らしているイワン・ヤーコウレヴィチという理髪師が朝食を取っていると、パンの中から人間の鼻が出てきた。その鼻は常連客である八等官のコワリョーフのものであると気づき、どこかに捨ててしまおうとするが……。一方、八等官コワリョーフは自分の鼻がなくなっていることに気が付いて……。
