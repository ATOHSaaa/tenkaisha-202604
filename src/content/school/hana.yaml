  appreciationTitle: 鑑賞の手引き
  appreciationParagraphs:
    - ニコライ・ゴーゴリの短編を原作にした文学ミュージカルです。理髪師と役人の「鼻」をめぐるユーモラスな物語を、朗読と生演奏・歌曲でお届けします。
    - 人の見栄や浅はかさを笑いながら考えられる作品です。読書感想文や道徳・国語の授業とあわせた鑑賞にもご活用ください。
