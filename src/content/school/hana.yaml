work: "『鼻』"
overview: 文学ミュージカル（2022年新作）
sourceCredit:
  name: ニコライ・ゴーゴリ
synopsis: >-
  ペテルブルクのウォズネセンスキイ通りで暮らしているイワン・ヤーコウレヴィチという理髪師が朝食を取っていると、パンの中から人間の鼻が出てきた。その鼻は常連客である八等官のコワリョーフのものであると気づき、どこかに捨ててしまおうとするが…。一方、八等官コワリョーフは自分の鼻がなくなっていることに気が付いて…。これまでに熊本市立奥古閑小学校などで上演しています。
targets:
  - 小学生
duration: 約60分
order: 4
